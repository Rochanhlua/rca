[package]
name = "rca"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "RCA: an AI-native programming language (early development)"

[lib]
name = "rca"
path = "src/lib.rs"

# §1: RCA compiler
[[bin]]
name = "rcac"
path = "src/main.rs"

# §1: RCA language executable
[[bin]]
name = "rca"
path = "src/bin/rca.rs"

[dependencies]
sha2 = "0.10"
rustls = "0.23"
webpki-roots = "0.26"
hmac = "0.12"
cranelift = "0.107"
cranelift-native = "0.107"
cranelift-object = "0.107"
cranelift-module = "0.107"
cranelift-codegen = "0.107"
cranelift-frontend = "0.107"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
